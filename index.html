<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Youtubers World_</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #0f111a; color: #fff; }

        /* PANTALLAS PRINCIPALES */
        .screen { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0f111a; }
        .hidden { display: none !important; }

        /* 1. PANTALLA INICIO */
        .title-main { font-size: 46px; font-weight: 900; color: #ff0055; text-transform: uppercase; text-shadow: 0 0 25px rgba(255,0,85,0.7); margin-bottom: 25px; text-align: center; }
        .btn-action { background: linear-gradient(90deg, #ff0055, #ff5500); border: none; padding: 16px 45px; border-radius: 50px; font-weight: 800; font-size: 18px; color: #fff; cursor: pointer; box-shadow: 0 8px 25px rgba(255,0,85,0.5); }
        .btn-action:active { transform: scale(0.95); }

        /* 2. TIENDA Y CREADOR ALEGRE */
        #screen-creator { background: linear-gradient(135deg, #1f1c2c, #928dab); justify-content: flex-start; padding: 20px; }
        .creator-container { display: flex; width: 100%; height: 80%; margin-top: 10px; gap: 20px; }
        .preview-box { flex: 1; background: rgba(255,255,255,0.1); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px dashed rgba(255,255,255,0.3); }
        .options-box { width: 320px; background: rgba(0,0,0,0.5); border-radius: 20px; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.15); color: #fff; outline: none; font-weight: 600; font-size: 13px; }
        .input-field::placeholder { color: #ddd; }
        .category-title { font-size: 13px; text-transform: uppercase; color: #ff0055; font-weight: 800; margin-top: 5px; }

        /* HUD DEL TELÉFONO (ESQUINA SUPERIOR DERECHA) */
        #phone-btn { position: absolute; top: 15px; right: 20px; z-index: 15; cursor: pointer; width: 55px; height: 55px; background: rgba(255,255,255,0.15); border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 28px; border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); }

        /* MODAL DEL TELÉFONO */
        #phone-modal { position: absolute; top: 80px; right: 20px; width: 310px; max-height: 420px; background: #161823; border-radius: 25px; border: 3px solid #333; z-index: 25; padding: 15px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .video-card { background: #222436; border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .video-title { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .video-stats { font-size: 11px; color: #bbb; display: flex; justify-content: space-between; margin-bottom: 6px; }
        .video-comments { font-size: 10px; color: #00ffcc; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 8px; max-height: 60px; overflow-y: auto; }

        /* JOYSTICK FLOTANTE (ESQUINA INFERIOR DERECHA) */
        #joystick-zone { position: absolute; bottom: 25px; right: 35px; width: 110px; height: 110px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; z-index: 10; touch-action: none; }
        #joystick-knob { position: absolute; top: 32px; left: 32px; width: 46px; height: 46px; background: #ff0055; border-radius: 50%; box-shadow: 0 0 15px #ff0055; }

        /* BOTÓN DE CÁMARA (GRABAR) */
        #cam-btn { position: absolute; bottom: 25px; left: 35px; z-index: 10; background: #ff0055; padding: 14px 28px; border-radius: 30px; border: none; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 5px 20px rgba(255,0,85,0.4); }

        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="screen-start" class="screen">
        <h1 class="title-main">Youtubers World_</h1>
        <button class="btn-action" onclick="openCreator()">COMENZAR</button>
    </div>

    <div id="screen-creator" class="screen hidden">
        <h2 style="font-weight: 900; text-transform: uppercase; font-size: 20px;">Tienda de Creación</h2>
        <div class="creator-container">
            <div class="preview-box">
                <span id="avatar-emoji" style="font-size: 90px;">🧍‍♀️</span>
                <span id="check-icon" class="hidden" style="font-size: 40px;">✅</span>
            </div>
            <div class="options-box">
                <div class="category-title">Datos del Canal</div>
                <input type="text" id="creator-name" class="input-field" placeholder="Nombre del Creador">
                <input type="text" id="channel-name" class="input-field" placeholder="Nombre del Canal">

                <div class="category-title">Tipo de Cuerpo</div>
                <button class="input-field" onclick="setGender('female')">👩 Femenino (Suave)</button>
                <button class="input-field" onclick="setGender('male')">👨 Masculino (Suave)</button>

                <div class="category-title">Accesorios 3D</div>
                <button class="input-field">🦩 Flotador Flamenco</button>
                <button class="input-field">🦆 Patito de Goma</button>
                <button class="input-field">👜 Bolso Pastel</button>

                <button class="btn-action" style="margin-top: 10px;" onclick="finishCreator()">¡Comenzar Carrera! ✅</button>
            </div>
        </div>
    </div>

    <div id="phone-btn" onclick="togglePhone()">📱</div>

    <div id="phone-modal" class="hidden">
        <h3 style="font-size: 15px; font-weight: 800; color: #ff0055;">📱 Mis Videos Grabados</h3>
        <div id="videos-list" style="overflow-y: auto; display: flex; flex-direction: column; gap: 10px; max-height: 330px;">
            <div style="font-size: 11px; color: #aaa; text-align: center; padding: 20px 0;">Aún no has grabado videos. Presiona "📹 Grabar Video" frente a la cámara.</div>
        </div>
    </div>

    <button id="cam-btn" onclick="recordVideo()">📹 Grabar Video</button>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="canvas-container"></div>

<script>
    // FLUJO PANTALLAS
    function openCreator() {
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-creator').classList.remove('hidden');
    }

    function setGender(type) {
        const emoji = document.getElementById('avatar-emoji');
        emoji.innerText = (type === 'female') ? '🧍‍♀️' : '🧍‍♂️';
        if (playerMesh) {
            if(type === 'female') playerMesh.scale.set(0.9, 0.95, 0.9);
            else playerMesh.scale.set(1, 1, 1);
        }
    }

    function finishCreator() {
        document.getElementById('check-icon').classList.remove('hidden');
        setTimeout(() => {
            document.getElementById('screen-creator').classList.add('hidden');
            init3DWorld();
        }, 1000);
    }

    function togglePhone() {
        document.getElementById('phone-modal').classList.toggle('hidden');
    }

    // LÓGICA Y MOTOR 3D REAL
    let scene, camera, renderer, playerGroup, playerMesh, leftLeg, rightLeg, leftArm, rightArm;
    let moveVector = { x: 0, z: 0 };
    let isTalking = false;
    let walkCycle = 0;
    let videos = [];

    function init3DWorld() {
        if(scene) return; // Evitar duplicar la escena

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x161823);

        // Cámara superior en 3D
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 12);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Luces estilo render suave
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Terreno (Cisneros Pequeño - Habitación)
        const floorGeo = new THREE.BoxGeometry(10, 0.4, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a3d52, roughness: 0.3 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.2;
        scene.add(floor);

        // Cámara de Grabación en el escenario
        const camGroup = new THREE.Group();
        const camBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        const camLens = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        camLens.rotation.x = Math.PI / 2;
        camLens.position.z = 0.5;
        camGroup.add(camBody, camLens);
        camGroup.position.set(0, 1, -3);
        scene.add(camGroup);

        // MODELO DE PERSONAJE ARTICULADO (Smooth Clay)
        playerGroup = new THREE.Group();
        const matBody = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.2 });

        // Cabeza
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 32), matBody);
        head.position.y = 1.6;
        playerGroup.add(head);

        // Torso
        playerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 0.9), matBody);
        playerMesh.position.y = 0.95;
        playerGroup.add(playerMesh);

        // Brazos articulados
        const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.6);
        leftArm = new THREE.Mesh(armGeo, matBody);
        leftArm.position.set(-0.45, 1.1, 0);
        rightArm = new THREE.Mesh(armGeo, matBody);
        rightArm.position.set(0.45, 1.1, 0);
        playerGroup.add(leftArm, rightArm);

        // Piernas articuladas
        const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.6);
        leftLeg = new THREE.Mesh(legGeo, matBody);
        leftLeg.position.set(-0.2, 0.3, 0);
        rightLeg = new THREE.Mesh(legGeo, matBody);
        rightLeg.position.set(0.2, 0.3, 0);
        playerGroup.add(leftLeg, rightLeg);

        scene.add(playerGroup);

        setupJoystick();
        animate();
    }

    // JOYSTICK FLOTANTE DERECHO
    function setupJoystick() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let active = false;

        zone.addEventListener('pointerdown', (e) => { active = true; handleMove(e); });
        window.addEventListener('pointermove', (e) => { if(active) handleMove(e); });
        window.addEventListener('pointerup', () => {
            active = false;
            knob.style.left = '32px';
            knob.style.top = '32px';
            moveVector = { x: 0, z: 0 };
        });

        function handleMove(e) {
            const rect = zone.getBoundingClientRect();
            let dx = e.clientX - (rect.left + rect.width / 2);
            let dy = e.clientY - (rect.top + rect.height / 2);
            const dist = Math.min(Math.hypot(dx, dy), 35);
            const angle = Math.atan2(dy, dx);

            knob.style.left = `${32 + Math.cos(angle) * dist}px`;
            knob.style.top = `${32 + Math.sin(angle) * dist}px`;

            moveVector.x = (Math.cos(angle) * dist) / 35;
            moveVector.z = (Math.sin(angle) * dist) / 35;
        }
    }

    // SISTEMA DE GRABACIÓN DE VIDEO
    function recordVideo() {
        if(!playerGroup) return;
        isTalking = true;
        playerGroup.rotation.y = Math.PI; // Mirar a la cámara

        setTimeout(() => {
            isTalking = false;
            const channel = document.getElementById('channel-name').value || 'Mi Canal';
            const views = Math.floor(Math.random() * 500) + 50;
            const likes = Math.floor(views * 0.8);
            const dislikes = Math.floor(Math.random() * 12);
            
            videos.unshift({
                title: `Video #${videos.length + 1} - ¡Mi Vida en${channel}!`,
                stats: `👁️ ${views} vistas | 👍 ${likes} \vert{} 👎${dislikes}`,
                comments: `💬 Fan1: "¡Súper divertido!" <br
