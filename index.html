<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTuber Avatar Studio</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="app-container">
        <!-- PANTALLA DE CREACIÓN DE PERSONAJE -->
        <div id="character-creator">
            <h2>✨ Diseña tu YouTuber ✨</h2>
            
            <div class="creator-layout">
                <!-- AVATAR INTERACTIVO -->
                <div class="avatar-preview-box">
                    <div id="avatar-display">
                        <div id="layer-body" class="avatar-layer body-adult-f"></div>
                        <div id="layer-hair" class="avatar-layer hair-1"></div>
                        <div id="layer-clothes" class="avatar-layer clothes-dress"></div>
                        <div id="layer-shoes" class="avatar-layer shoes-1"></div>
                        <div id="layer-acc" class="avatar-layer acc-none"></div>
                    </div>
                </div>

                <!-- PANEL DE CUSTOMIZACIÓN -->
                <div class="customizer-panel">
                    <!-- Categorías de personalización -->
                    <div class="category-tabs">
                        <button onclick="setTab('type')">👤 Tipo</button>
                        <button onclick="setTab('hair')">💇‍♀️ Pelo</button>
                        <button onclick="setTab('clothes')">👗 Ropa</button>
                        <button onclick="setTab('shoes')">👟 Calzado</button>
                        <button onclick="setTab('acc')">🎧 Extra</button>
                    </div>

                    <!-- Opciones que cambian según la pestaña -->
                    <div id="options-container" class="options-grid">
                        <!-- Se llena dinámicamente con JavaScript -->
                    </div>

                    <div class="inputs-box">
                        <input type="text" id="username" placeholder="Tu Nombre / Nickname">
                        <input type="text" id="channel-name" placeholder="Nombre de tu Canal">
                        <button id="btn-start" onclick="startGame()">¡Comenzar Carrera!</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANTALLA DEL JUEGO -->
        <div id="game-dashboard" class="hidden">
            <header class="stats-bar">
                <div>👤 <span id="stat-subs">0</span> Subs</div>
                <div>👁️ <span id="stat-views">0</span> Vistas</div>
                <div>💰 $<span id="stat-money">0</span></div>
            </header>
            <main class="game-content">
                <h3>🎬 Grabación de Contenido</h3>
                <input type="text" id="video-title" placeholder="Título de tu video...">
                <button onclick="createVideo()">Publicar Video</button>
                <div id="comments-feed"></div>
            </main>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
