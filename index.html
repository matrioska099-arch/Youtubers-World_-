<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTuber Life Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

        .game-card { background: #1e293b; width: 100%; max-width: 430px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; border: 2px solid #334155; }
        
        /* BARRA SUPERIOR */
        .stats-bar { background: #0f172a; padding: 12px 15px; display: flex; justify-content: space-around; font-family: 'Fredoka One', cursive; font-size: 15px; border-bottom: 2px solid #334155; }
        .stat-val { color: #facc15; }

        /* NAVEGACIÓN DE VISTAS */
        .nav-tabs { display: flex; background: #0f172a; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #1e293b; color: #94a3b8; font-weight: 800; border-radius: 12px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .tab-btn.active { background: #ff0055; color: white; }

        /* VISTAS */
        .view-section { display: none; padding: 15px; flex-direction: column; gap: 15px; }
        .view-section.active { display: flex; }

        /* AVATAR Y VESTIDOR */
        .avatar-display { background: linear-gradient(180deg, #38bdf8 0%, #818cf8 100%); border-radius: 20px; height: 260px; display: flex; justify-content: center; align-items: center; position: relative; border: 3px solid #64748b; overflow: hidden; }
        
        .doll-body { width: 110px; height: 220px; position: relative; }
        .doll-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }

        /* TIENDA DE ROPA */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .shop-item { background: #0f172a; border: 2px solid #334155; border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .shop-item span { font-size: 13px; font-weight: 800; color: #e2e8f0; }
        .shop-btn { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 12px; width: 100%; cursor: pointer; }
        .shop-btn.equipped { background: #64748b; }

        /* PANEL DE GRABACIÓN */
        .panel-box { background: #0f172a; border-radius: 16px; padding: 15px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
        .panel-title { font-family: 'Fredoka One', cursive; font-size: 16px; color: #ff0055; }

        input { padding: 12px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #ff0055; }

        .btn-action { background: #10b981; color: white; border: none; padding: 12px; border-radius: 12px; font-family: 'Fredoka One', cursive; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #059669; }
        .btn-action:active { transform: translateY(3px); box-shadow: none; }

        /* FEED DE COMENTARIOS */
        .comments-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .comment-card { background: #1e293b; padding: 10px; border-radius: 10px; font-size: 12px; border-left: 4px solid #10b981; }
        .comment-card.hate { border-left-color: #ef4444; }
        .comment-user { font-weight: 800; color: #facc15; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="game-card">
    <!-- BARRA SUPERIOR DE ESTADÍSTICAS -->
    <div class="stats-bar">
        <div>👥 <span id="stat-subs" class="stat-val">0</span> Subs</div>
        <div>👁️ <span id="stat-views" class="stat-val">0</span> Vistas</div>
        <div>💰 $<span id="stat-money" class="stat-val">50</span></div>
    </div>

    <!-- PESTAÑAS PARA MOVER AL PERSONAJE -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('studio')">🎬 Grabación</button>
        <button class="tab-btn" onclick="switchView('shop')">🛍️ Tienda de Ropa</button>
    </div>

    <!-- VISTA 1: STUDIO Y GRABACIÓN -->
    <div id="view-studio" class="view-section active">
        <div class="avatar-display">
            <div class="doll-body">
                <svg viewBox="0 0 100 200" class="doll-layer">
                    <!-- CUERPO -->
                    <circle cx="50" cy="35" r="20" fill="#fbcfe8"/>
                    <rect x="42" y="55" width="16" height="60" rx="8" fill="#fbcfe8"/>
                    <rect x="36" y="110" width="10" height="70" rx="5" fill="#fbcfe8"/>
                    <rect x="54" y="110" width="10" height="70" rx="5" fill="#fbcfe8"/>
                    <!-- OJOS Y SONRISA -->
                    <circle cx="43" cy="32" r="2.5" fill="#1e293b"/>
                    <circle cx="57" cy="32" r="2.5" fill="#1e293b"/>
                    <path d="M 45 42 Q 50 47 55 42" stroke="#1e293b" stroke-width="2" fill="none"/>
                </svg>
                <!-- CABELLO -->
                <svg id="layer-hair" viewBox="0 0 100 200" class="doll-layer">
                    <path d="M 25 35 C 25 10, 75 10, 75 35 C 80 60, 75 90, 70 100 C 65 70, 70 35, 50 25 C 30 35, 35 70, 30 100 C 25 90, 20 60, 25 35 Z" fill="#475569"/>
                </svg>
                <!-- ROPA -->
                <svg id="layer-clothes" viewBox="0 0 100 200" class="doll-layer">
                    <path d="M 38 60 L 62 60 L 68 105 L 32 105 Z" fill="#ec4899"/>
                </svg>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">📹 Publicar Nuevo Video</div>
            <input type="text" id="video-title" placeholder="Escribe el título de tu video...">
            <button class="btn-action" onclick="publishVideo()">🚀 PUBLICAR</button>
        </div>

        <div class="panel-box">
            <div class="panel-title">💬 Comentarios de la Comunidad</div>
            <div id="comments-list" class="comments-list">
                <div class="comment-card"><div class="comment-user">Sistema</div>¡Escribe un título original para recibir buenos comentarios!</div>
            </div>
        </div>
    </div>

    <!-- VISTA 2: TIENDA DE ROPA -->
    <div id="view-shop" class="view-section">
        <div class="panel-title" style="text-align: center;">🛍️ Tienda de Outfits</div>
        <div class="shop-grid">
            <div class="shop-item">
                <div style="width:40px; height:40px; background:#ec4899; border-radius:10px;"></div>
                <span>Vestido Rosa</span>
                <button class="shop-btn equipped" onclick="equipOutfit('#ec4899')">Puesto</button>
            </div>
            <div class="shop-item">
                <div style="width:40px; height:40px; background:#8b5cf6; border-radius:10px;"></div>
                <span>Outfit Morado</span>
                <button id="btn-buy-1" class="shop-btn" onclick="buyOutfit(1, '#8b5cf6', 30)">Comprar $30</button>
            </div>
            <div class="shop-item">
                <div style="width:40px; height:40px; background:#06b6d4; border-radius:10px;"></div>
                <span>Top Turquesa</span>
                <button id="btn-buy-2" class="shop-btn" onclick="buyOutfit(2, '#06b6d4', 60)">Comprar $60</button>
            </div>
            <div class="shop-item">
                <div style="width:40px; height:40px; background:#f59e0b; border-radius:10px;"></div>
                <span>Vestido Dorado VIP</span>
                <button id="btn-buy-3" class="shop-btn" onclick="buyOutfit(3, '#f59e0b', 100)">Comprar $100</button>
            </div>
        </div>
    </div>
</div>

<script>
    let stats = { subs: 0, views: 0, money: 50 };
    let ownedOutfits = [0];

    function switchView(viewName) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        document.getElementById(`view-${viewName}`).classList.add('active');
        event.target.classList.add('active');
    }

    function equipOutfit(color) {
        document.getElementById('layer-clothes').querySelector('path').setAttribute('fill', color);
    }

    function buyOutfit(id, color, price) {
        if (ownedOutfits.includes(id)) {
            equipOutfit(color);
            return;
        }

        if (stats.money >= price) {
            stats.money -= price;
            ownedOutfits.push(id);
            document.getElementById(`btn-buy-${id}`).innerText = "Equipar";
            document.getElementById(`btn-buy-${id}`).style.background = "#3b82f6";
            equipOutfit(color);
            updateStats();
        } else {
            alert("¡No tienes suficiente dinero! Sigue grabando videos para ganar más.");
        }
    }

    function publishVideo() {
        const input = document.getElementById('video-title');
        const title = input.value.trim();

        // Si pone solo puntos o textos muy cortos
        if (!title || title.length < 3 || /^[\.\s]+$/.test(title)) {
            let lossSubs = Math.floor(Math.random() * 5) + 3;
            stats.subs = Math.max(0, stats.subs - lossSubs);
            
            addComment("Hater_01", "¡Qué video tan malo! Ni siquiera le pusiste un título de verdad. 😡", true);
            addComment("Fan_Decepcionado", "Perdiste un suscriptor, sube algo mejor la próxima. 📉", true);
            updateStats();
            input.value = '';
            return;
        }

        // Sistema dinámico de respuestas variadas
        const isCritical = Math.random() < 0.35; // 35% de probabilidad de recibir críticas

        if (isCritical) {
            let gainViews = Math.floor(Math.random() * 80) + 20;
            let lossSubs = Math.floor(Math.random() * 4) + 1;

            stats.views += gainViews;
            stats.subs = Math.max(0, stats.subs - lossSubs);

            const badComments = [
                `No me gustó mucho este video de "${title}", se sintió aburrido. 👎`,
                `Siento que la calidad bajó un poco en este video... 💔`,
                `Esperaba algo más divertido sobre ${title}.`
            ];
            let randBad = badComments[Math.floor(Math.random() * badComments.length)];
            addComment("Critico_YT", randBad, true);
        } else {
            let gainViews = Math.floor(Math.random() * 300) + 100;
            let gainSubs = Math.floor(gainViews / 6);
            let gainMoney = Math.floor(gainViews * 0.15);

            stats.views += gainViews;
            stats.subs += gainSubs;
            stats.money += gainMoney;

            const goodComments = [
                `¡Me encantan tus videos sobre ${title}! Tienes mucho talento ✨`,
                `¡Nuevo sub! Me reí muchísimo con este video ❤️`,
                `¡Qué buena edición! Sigue subiendo contenido así 🚀`,
                `Amé totalmente este video sobre ${title} 🔥`
            ];
            let randGood = goodComments[Math.floor(Math.random() * goodComments.length)];
            addComment("Suscriptor_Fiel", randGood, false);
        }

        updateStats();
        input.value = '';
    }

    function addComment(user, text, isHate) {
        const list = document.getElementById('comments-list');
        const card = document.createElement('div');
        card.className = `comment-card ${isHate ? 'hate' : ''}`;
        card.innerHTML = `<div class="comment-user">${user}</div>${text}`;
        list.prepend(card);
    }

    function updateStats() {
        document.getElementById('stat-subs').innerText = stats.subs;
        document.getElementById('stat-views').innerText = stats.views;
        document.getElementById('stat-money').innerText = stats.money;
    }
</script>

</body>
</html>
