<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Youtuber Life & Decorator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

        .game-card { background: #1e293b; width: 100%; max-width: 450px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; border: 2px solid #334155; }
        
        /* BARRA DE ESTADÍSTICAS */
        .stats-bar { background: #0f172a; padding: 12px 15px; display: flex; justify-content: space-around; font-family: 'Fredoka One', cursive; font-size: 15px; border-bottom: 2px solid #334155; }
        .stat-val { color: #facc15; }

        /* NAVEGACIÓN ENTRE HABITACIONES Y TIENDA */
        .nav-tabs { display: flex; background: #0f172a; padding: 5px; gap: 4px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px 6px; border: none; background: #1e293b; color: #94a3b8; font-weight: 800; border-radius: 12px; cursor: pointer; font-size: 12px; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { background: #ff0055; color: white; }

        /* VISTAS */
        .view-section { display: none; padding: 15px; flex-direction: column; gap: 12px; }
        .view-section.active { display: flex; }

        /* ESCENARIO INTERACTIVO (HABITACIÓN / ESTUDIO) */
        .room-display { border-radius: 20px; height: 250px; position: relative; border: 3px solid #64748b; overflow: hidden; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; transition: 0.3s; }
        
        /* MUEBLES DENTRO DEL ESCENARIO */
        .furniture { position: absolute; pointer-events: none; transition: 0.3s; }
        #item-bed { bottom: 10px; left: 10px; font-size: 45px; }
        #item-tech { bottom: 15px; right: 10px; font-size: 40px; }
        #item-light { top: 10px; right: 15px; font-size: 30px; }
        #item-tv { top: 20px; left: 20px; font-size: 35px; }

        /* PERSONAJE */
        .doll-body { width: 90px; height: 180px; position: relative; z-index: 5; }
        .doll-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }

        /* TIENDA Y CATEGORÍAS */
        .shop-categories { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn { background: #334155; border: none; color: white; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: #3b82f6; }

        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 220px; overflow-y: auto; }
        .shop-item { background: #0f172a; border: 2px solid #334155; border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .shop-item span { font-size: 12px; font-weight: 800; color: #e2e8f0; }
        .shop-btn { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 12px; width: 100%; cursor: pointer; }
        .shop-btn.owned { background: #64748b; }

        /* CONTROLES Y FEED */
        .panel-box { background: #0f172a; border-radius: 16px; padding: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .panel-title { font-family: 'Fredoka One', cursive; font-size: 15px; color: #ff0055; }

        input { padding: 10px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; color: white; font-size: 13px; outline: none; }
        .btn-action { background: #10b981; color: white; border: none; padding: 12px; border-radius: 12px; font-family: 'Fredoka One', cursive; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #059669; }

        .comments-list { max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .comment-card { background: #1e293b; padding: 8px 10px; border-radius: 10px; font-size: 11px; border-left: 4px solid #10b981; }
        .comment-card.hate { border-left-color: #ef4444; }
        .comment-user { font-weight: 800; color: #facc15; }
    </style>
</head>
<body>

<div class="game-card">
    <!-- BARRA DE ESTADÍSTICAS -->
    <div class="stats-bar">
        <div>👥 <span id="stat-subs" class="stat-val">0</span></div>
        <div>👁️ <span id="stat-views" class="stat-val">0</span></div>
        <div>💰 $<span id="stat-money" class="stat-val">100</span></div>
    </div>

    <!-- PESTAÑAS DE HABITACIONES -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('studio')">🎙️ Estudio YT</button>
        <button class="tab-btn" onclick="switchView('bedroom')">🛏️ Cuarto</button>
        <button class="tab-btn" onclick="switchView('shop')">🛍️ Tienda Casa</button>
    </div>

    <!-- VISTA 1: ESTUDIO DE YOUTUBE -->
    <div id="view-studio" class="view-section active">
        <div id="room-studio-bg" class="room-display" style="background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);">
            <div id="item-light" class="furniture">💡</div>
            <div id="item-tech" class="furniture">💻</div>
            
            <div class="doll-body">
                <svg viewBox="0 0 100 200" class="doll-layer">
                    <circle cx="50" cy="35" r="20" fill="#fbcfe8"/>
                    <rect x="42" y="55" width="16" height="60" rx="8" fill="#fbcfe8"/>
                    <rect x="36" y="110" width="10" height="70" rx="5" fill="#fbcfe8"/>
                    <rect x="54" y="110" width="10" height="70" rx="5" fill="#fbcfe8"/>
                    <circle cx="43" cy="32" r="2.5" fill="#1e293b"/>
                    <circle cx="57" cy="32" r="2.5" fill="#1e293b"/>
                    <path d="M 45 42 Q 50 47 55 42" stroke="#1e293b" stroke-width="2" fill="none"/>
                </svg>
                <svg viewBox="0 0 100 200" class="doll-layer"><path d="M 25 35 C 25 10, 75 10, 75 35 C 80 60, 75 90, 70 100 C 65 70, 70 35, 50 25 C 30 35, 35 70, 30 100 Z" fill="#475569"/></svg>
                <svg id="layer-clothes-1" viewBox="0 0 100 200" class="doll-layer"><path d="M 38 60 L 62 60 L 68 105 L 32 105 Z" fill="#ec4899"/></svg>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">📹 Grabar Nuevo Video</div>
            <input type="text" id="video-title" placeholder="Título de tu video...">
            <button class="btn-action" onclick="publishVideo()">🚀 PUBLICAR VIDEO</button>
        </div>

        <div class="panel-box">
            <div class="panel-title">💬 Comentarios de Fans</div>
            <div id="comments-list" class="comments-list">
                <div class="comment-card"><div class="comment-user">Sistema</div>¡Escribe un título original para ganar visitas!</div>
            </div>
        </div>
    </div>

    <!-- VISTA 2: DORMITORIO / CUARTO -->
    <div id="view-bedroom" class="view-section">
        <div id="room-bedroom-bg" class="room-display" style="background: linear-gradient(180deg, #0284c7 0%, #bae6fd 100%);">
            <div id="item-bed" class="furniture">🛏️</div>
            <div id="item-tv" class="furniture">📺</div>
            
            <div class="doll-body">
                <svg viewBox="0 0 100 200" class="doll-layer">
                    <circle cx="50" cy="35" r="20" fill="#fbcfe8"/>
                    <rect x="42" y="55" width="16" height="60" rx="8" fill="#fbcfe8"/>
                    <rect x="36" y="110" width="10" height="70" rx="5" fill="#fbcfe8"/>
                    <rect x="54" y="110" width="10" height="70" rx="5" fill="#fbcfe8"/>
                    <circle cx="43" cy="32" r="2.5" fill="#1e293b"/>
                    <circle cx="57" cy="32" r="2.5" fill="#1e293b"/>
                    <path d="M 45 42 Q 50 47 55 42" stroke="#1e293b" stroke-width="2" fill="none"/>
                </svg>
                <svg viewBox="0 0 100 200" class="doll-layer"><path d="M 25 35 C 25 10, 75 10, 75 35 C 80 60, 75 90, 70 100 C 65 70, 70 35, 50 25 C 30 35, 35 70, 30 100 Z" fill="#475569"/></svg>
                <svg id="layer-clothes-2" viewBox="0 0 100 200" class="doll-layer"><path d="M 38 60 L 62 60 L 68 105 L 32 105 Z" fill="#ec4899"/></svg>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">🏠 Estado de la Casa</div>
            <p style="font-size: 12px; color: #cbd5e1;">Remodela tu dormitorio y tu estudio desde la tienda para mejorar el nivel de tu casa y la calidad de tus producciones.</p>
        </div>
    </div>

    <!-- VISTA 3: TIENDA DE DECORACIÓN Y REMODELACIÓN -->
    <div id="view-shop" class="view-section">
        <div class="panel-title" style="text-align: center;">🛒 Tienda de Decoración</div>
        
        <div class="shop-categories">
            <button class="cat-btn active" onclick="loadShopCat('walls')">🎨 Paredes</button>
            <button class="cat-btn" onclick="loadShopCat('beds')">🛏️ Camas</button>
            <button class="cat-btn" onclick="loadShopCat('tech')">📷 Equipo YT</button>
            <button class="cat-btn" onclick="loadShopCat('decor')">🚨 Luces/TV</button>
        </div>

        <div id="shop-grid" class="shop-grid"></div>
    </div>
</div>

<script>
    let stats = { subs: 0, views: 0, money: 100, qualityBonus: 1 };
    let inventory = [];

    const shopData = {
        walls: [
            { id: 'w_pink', name: 'Pared Rosa Pastel', price: 40, type: 'wall_studio', val: 'linear-gradient(180deg, #f472b6 0%, #fbcfe8 100%)' },
            { id: 'w_neon', name: 'Pared Cyberpunk', price: 80, type: 'wall_studio', val: 'linear-gradient(180deg, #06b6d4 0%, #3b82f6 100%)' },
            { id: 'w_gold', name: 'Pared Mansión VIP', price: 150, type: 'wall_bedroom', val: 'linear-gradient(180deg, #f59e0b 0%, #fef3c7 100%)' }
        ],
        beds: [
            { id: 'b_king', name: 'Cama King Size', price: 120, type: 'bed', val: '🛋️' },
            { id: 'b_princess', name: 'Cama Princesa', price: 200, type: 'bed', val: '👑' }
        ],
        tech: [
            { id: 't_cam', name: 'Cámara 4K Pro', price: 150, type: 'tech', val: '📷', bonus: 2 },
            { id: 't_pc', name: 'PC Gamer Doble Monitor', price: 300, type: 'tech', val: '🖥️', bonus: 4 }
        ],
        decor: [
            { id: 'd_neon', name: 'Luces Neón Streamer', price: 90, type: 'light', val: '🚨' },
            { id: 'd_tv', name: 'Televisor Smart 65"', price: 180, type: 'tv', val: '🖥️' }
        ]
    };

    function switchView(viewName) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        document.getElementById(`view-${viewName}`).classList.add('active');
        event.target.classList.add('active');
    }

    function loadShopCat(cat) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';

        shopData[cat].forEach(item => {
            const isOwned = inventory.includes(item.id);
            const el = document.createElement('div');
            el.className = 'shop-item';
            el.innerHTML = `
                <span>${item.name}</span>
                <span style="color:#facc15; font-size:11px;">$${item.price}</span>
                <button class="shop-btn ${isOwned ? 'owned' : ''}" onclick="buyItem('${item.id}', ${item.price}, '${item.type}', '${item.val}', ${item.bonus || 0})">
                    ${isOwned ? 'Comprado' : 'Comprar'}
                </button>
            `;
            grid.appendChild(el);
        });
    }

    function buyItem(id, price, type, val, bonus) {
        if (inventory.includes(id)) return;

        if (stats.money >= price) {
            stats.money -= price;
            inventory.push(id);

            // APLICAR CAMBIOS VISUALES
            if (type === 'wall_studio') document.getElementById('room-studio-bg').style.background = val;
            if (type === 'wall_bedroom') document.getElementById('room-bedroom-bg').style.background = val;
            if (type === 'bed') document.getElementById('item-bed').innerText = val;
            if (type === 'tech') { document.getElementById('item-tech').innerText = val; stats.qualityBonus += bonus; }
            if (type === 'light') document.getElementById('item-light').innerText = val;
            if (type === 'tv') document.getElementById('item-tv').innerText = val;

            updateStats();
            loadShopCat('walls');
        } else {
            alert("¡No tienes suficiente dinero! Graba más videos.");
        }
    }

    function publishVideo() {
        const input = document.getElementById('video-title');
        const title = input.value.trim();

        if (!title || title.length < 3 || /^[\.\s]+$/.test(title)) {
            let lossSubs = Math.floor(Math.random() * 5) + 3;
            stats.subs = Math.max(0, stats.subs - lossSubs);
            addComment("Critico_01", "¡Qué mala calidad de video y título vacío! 😡", true);
            updateStats();
            input.value = '';
            return;
        }

        const isCritical = Math.random() < 0.3;

        if (isCritical) {
            let gainViews = Math.floor(Math.random() * 50) + 10;
            stats.views += gainViews;
            stats.subs = Math.max(0, stats.subs - 2);
            addComment("Hater_YT", `No me gustó el contenido sobre "${title}". 👎`, true);
        } else {
            let gainViews = (Math.floor(Math.random() * 200) + 80) * stats.qualityBonus;
            let gainSubs = Math.floor(gainViews / 6);
            let gainMoney = Math.floor(gainViews * 0.2);

            stats.views += gainViews;
            stats.subs += gainSubs;
            stats.money += gainMoney;

            addComment("Fan_Pro", `¡Increíble video sobre ${title}! La calidad se ve brutal 🔥`, false);
        }

        updateStats();
        input.value = '';
    }

    function addComment(user, text, isHate) {
        const list = document.getElementById('comments-list');
        const card = document.createElement('div');
        card.className = `comment-card ${isHate ? 'hate' : ''}`;
        card.innerHTML = `<div class="comment-user">${user}</div>${text}`;
        list.prepend(card);
    }

    function updateStats() {
        document.getElementById('stat-subs').innerText = stats.subs;
        document.getElementById('stat-views').innerText = stats.views;
        document.getElementById('stat-money').innerText = stats.money;
    }

    loadShopCat('walls');
</script>

</body>
</html>
