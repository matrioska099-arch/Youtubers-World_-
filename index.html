<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crea tu Estrella de YouTube</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f111a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }

        .editor-container { background: #161824; width: 100%; max-width: 900px; border-radius: 24px; border: 1px solid #2a2e45; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }

        /* BARRA SUPERIOR */
        .top-header { background: #1f2235; padding: 14px 20px; text-align: center; border-bottom: 1px solid #2a2e45; }
        .top-header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }

        /* ÁREA PRINCIPAL (ESCENARIO + MENÚ) */
        .main-layout { display: flex; flex-direction: column; }
        @media (min-width: 768px) {
            .main-layout { flex-direction: row; height: 520px; }
        }

        /* ESCENARIO DE AVATAR (3D LOOK) */
        .stage-view { flex: 1.2; position: relative; background: url('https://images.unsplash.com/photo-1598550476439-6847785fcea6?w=1000&auto=format&fit=crop&q=80') center/cover; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 20px; min-height: 320px; }
        .stage-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,17,26,0.3) 0%, rgba(15,17,26,0.7) 100%); }

        .avatar-preview { position: relative; z-index: 2; height: 260px; width: auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6)); transition: all 0.3s ease; }

        /* PANELDENAMBRE E INICIO */
        .creator-form { position: relative; z-index: 2; display: flex; gap: 8px; width: 100%; max-width: 380px; margin-top: 15px; }
        .creator-form input { flex: 1; padding: 10px 14px; background: rgba(22, 24, 36, 0.9); border: 1px solid #3b3f5c; border-radius: 12px; color: #fff; font-size: 12px; outline: none; }
        .btn-start { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 12px; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); white-space: nowrap; }

        /* PANEL LATERAL DE PERSONALIZACIÓN */
        .customizer-panel { flex: 1; background: #1f2235; border-left: 1px solid #2a2e45; display: flex; flex-direction: column; }

        /* NAVEGACIÓN DE CATEGORÍAS */
        .category-tabs { display: flex; overflow-x: auto; background: #161824; border-bottom: 1px solid #2a2e45; padding: 8px; gap: 6px; }
        .cat-tab { background: transparent; border: none; color: #8a8fb0; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 11px; cursor: pointer; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .cat-tab.active { background: #ff0055; color: #fff; }

        /* SECCIONES OPCIONES */
        .options-grid { padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; overflow-y: auto; max-height: 360px; }
        .option-card { background: #161824; border: 2px solid #2a2e45; border-radius: 14px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .option-card:hover, .option-card.selected { border-color: #ff0055; background: #25283d; }
        .option-card img { width: 55px; height: 55px; object-fit: contain; }
        .option-card span { font-size: 11px; font-weight: 600; color: #d1d5db; }

        /* SELECTOR DE TONO DE PIEL */
        .skin-selector { display: flex; justify-content: center; gap: 12px; padding: 12px; background: #161824; border-bottom: 1px solid #2a2e45; }
        .skin-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: transform 0.2s; }
        .skin-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div class="editor-container">
    <div class="top-header">
        <h1>Crea tu Estrella de YouTube</h1>
    </div>

    <div class="main-layout">
        <!-- ESCENARIO CON AVATAR 3D -->
        <div class="stage-view">
            <div class="stage-overlay"></div>
            <img id="avatar-preview" class="avatar-preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Laura1&skinColor=f8d25c&top[]=longHair&hairColor[]=brown&clothing[]=hoodie" alt="Avatar Preview">
            
            <div class="creator-form">
                <input type="text" id="channel-name" placeholder="Nombre de tu Canal...">
                <button class="btn-start" onclick="saveAvatar()">¡Comenzar Carrera!</button>
            </div>
        </div>

        <!-- PANEL DE PERSONALIZACIÓN -->
        <div class="customizer-panel">
            <!-- SELECCIÓN DE TONO DE PIEL -->
            <div class="skin-selector">
                <div class="skin-btn" style="background: #ffdbb4;" title="Piel Clara" onclick="setSkin('ffdbb4')"></div>
                <div class="skin-btn" style="background: #edb481;" title="Piel Trigueña" onclick="setSkin('edb481')"></div>
                <div class="skin-btn" style="background: #d08b5b;" title="Piel Morena" onclick="setSkin('d08b5b')"></div>
                <div class="skin-btn" style="background: #ae5d29;" title="Piel Oscura" onclick="setSkin('ae5d29')"></div>
            </div>

            <!-- PESTAÑAS DE CATEGORÍAS -->
            <div class="category-tabs">
                <button class="cat-tab active" onclick="loadCategory('hair')">💇‍♀️ Cabello</button>
                <button class="cat-tab" onclick="loadCategory('clothes')">👗 Ropa</button>
                <button class="cat-tab" onclick="loadCategory('accessories')">🎧 Accesorios</button>
            </div>

            <!-- GRID DE OPCIONES -->
            <div id="options-grid" class="options-grid"></div>
        </div>
    </div>
</div>

<script>
    let avatarState = {
        seed: 'Laura1',
        skinColor: 'ffdbb4',
        top: 'longHair',
        clothing: 'hoodie',
        accessories: 'blank'
    };

    const CUSTOM_DATA = {
        hair: [
            { id: 'longHair', name: 'Largo Ondulado', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Hair1&top[]=longHair' },
            { id: 'bob', name: 'Corte Bob', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Hair2&top[]=bob' },
            { id: 'curly', name: 'Rizado Afro', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Hair3&top[]=curly' },
            { id: 'straight01', name: 'Liso Natural', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Hair4&top[]=straight01' }
        ],
        clothes: [
            { id: 'hoodie', name: 'Hoodie Gamer', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cloth1&clothing[]=hoodie' },
            { id: 'overall', name: 'Jardinera Chic', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cloth2&clothing[]=overall' },
            { id: 'blazerAndShirt', name: 'Blazer VIP', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cloth3&clothing[]=blazerAndShirt' },
            { id: 'shirtCrewNeck', name: 'Polera Casual', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cloth4&clothing[]=shirtCrewNeck' }
        ],
        accessories: [
            { id: 'blank', name: 'Ninguno', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Acc0' },
            { id: 'prescription02', name: 'Lentes Trendy', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Acc1&accessories[]=prescription02' },
            { id: 'round', name: 'Lentes Retro', img: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Acc2&accessories[]=round' }
        ]
    };

    function updateAvatar() {
        const url = `https://api.dicebear.com/7.x/avataaars/svg?seed=${avatarState.seed}&skinColor=${avatarState.skinColor}&top[]=${avatarState.top}&hairColor[]=brown&clothing[]=${avatarState.clothing}&accessories[]=${avatarState.accessories}`;
        document.getElementById('avatar-preview').src = url;
    }

    function setSkin(color) {
        avatarState.skinColor = color;
        updateAvatar();
    }

    function loadCategory(cat) {
        document.querySelectorAll('.cat-tab').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';

        CUSTOM_DATA[cat].forEach(item => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.onclick = () => selectOption(cat, item.id);
            card.innerHTML = `
                <img src="${item.img}" alt="${item.name}">
                <span>${item.name}</span>
            `;
            grid.appendChild(card);
        });
    }

    function selectOption(cat, value) {
        if (cat === 'hair') avatarState.top = value;
        if (cat === 'clothes') avatarState.clothing = value;
        if (cat === 'accessories') avatarState.accessories = value;
        updateAvatar();
    }

    function saveAvatar() {
        const name = document.getElementById('channel-name').value.trim();
        if (!name) {
            alert("¡Escribe un nombre para tu canal de YouTube!");
            return;
        }
        alert(`¡Avatar guardado con éxito! Bienvenido a la carrera de ${name}`);
    }

    // Cargar categoría por defecto
    loadCategory('hair');
</script>

</body>
</html>
