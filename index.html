<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tienda 3D Isométrica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { overflow: hidden; background: #1a1a1a; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        .ui-panel { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 16px; border: 1px solid rgba(255,255,255,0.2); }
        .controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 2px 4px #000; }
    </style>
    <!-- MOTOR THREE.JS PARA GRÁFICOS 3D REALES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="ui-panel">💰 Dinero: $<span id="money">100</span></div>
<div class="controls-hint">Toca o haz clic en el suelo para mover al personaje en 3D</div>
<div id="canvas-container"></div>

<script>
    // 1. CONFIGURACIÓN DE ESCENA 3D ISOMÉTRICA
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2c39);

    const aspect = window.innerWidth / window.innerHeight;
    const d = 10;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    
    // Posición Isométrica
    camera.position.set(20, 20, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. ILUMINACIÓN 3D
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(15, 30, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3. SUELO / PISO DE LA TIENDA
    const floorGeo = new THREE.BoxGeometry(14, 0.5, 14);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xe0a96d });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -0.25;
    scene.add(floor);

    // 4. MOSTRADOR Y OSO DE PELUCHE 3D
    const counterGeo = new THREE.BoxGeometry(4, 1.5, 2);
    const counterMat = new THREE.MeshStandardMaterial({ color: 0xd9534f });
    const counter = new THREE.Mesh(counterGeo, counterMat);
    counter.position.set(0, 0.75, 2);
    scene.add(counter);

    // OSO EN 3D (Construido con formas volumétricas)
    const bearGroup = new THREE.Group();
    const bearMat = new THREE.MeshStandardMaterial({ color: 0xb05834 });
    
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), bearMat);
    body.position.y = 0.8;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), bearMat);
    head.position.y = 1.8;

    bearGroup.add(body);
    bearGroup.add(head);
    bearGroup.position.set(0, 1.5, 2);
    scene.add(bearGroup);

    // 5. PERSONAJE 3D (Estilo Stickman 3D)
    const playerGroup = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const clothesMat = new THREE.MeshStandardMaterial({ color: 0x337ab7 });

    const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), skinMat);
    pHead.position.y = 1.8;
    const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1), clothesMat);
    pBody.position.y = 0.9;

    playerGroup.add(pHead);
    playerGroup.add(pBody);
    playerGroup.position.set(-3, 0, -3);
    scene.add(playerGroup);

    // MOVIMIENTO DEL PERSONAJE
    let targetPos = playerGroup.position.clone();
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(floor);

        if (intersects.length > 0) {
            targetPos = intersects[0].point;
            targetPos.y = 0;
        }
    });

    // BUCLE DE ANIMACIÓN
    function animate() {
        requestAnimationFrame(animate);
        
        // Suavizar movimiento del personaje hacia donde se hace clic
        playerGroup.position.lerp(targetPos, 0.05);

        // Rotación continua del oso decorativo
        bearGroup.rotation.y += 0.01;

        renderer.render(scene, camera);
    }
    animate();

    // Ajuste de pantalla
    window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
