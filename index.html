<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Youtuber Studio Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; }
        body { background: #12131C; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

        .game-app { background: #1B1D2A; width: 100%; max-width: 410px; border-radius: 28px; overflow: hidden; border: 2px solid #2A2D40; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }

        /* HEADER / STATS */
        .top-bar { background: #12131C; padding: 12px 16px; display: flex; justify-content: space-around; font-size: 14px; font-weight: 700; border-bottom: 2px solid #2A2D40; }
        .stat-val { color: #FFD166; }

        /* NAVEGACIÓN */
        .tabs { display: flex; background: #12131C; padding: 6px; gap: 6px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #1B1D2A; color: #8B8EA7; font-weight: 700; border-radius: 14px; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: #FF2A5F; color: #fff; }

        /* VISTAS */
        .view-content { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

        /* CUARTO / ESTUDIO */
        .room-stage { height: 240px; border-radius: 20px; position: relative; background: linear-gradient(180deg, #6C5CE7 0%, #a29bfe 100%); display: flex; justify-content: center; align-items: flex-end; overflow: hidden; border: 2px solid #3F4361; }
        .avatar-real { height: 190px; width: auto; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.3)); }

        /* PANELES DE ACCIÓN */
        .panel { background: #232637; border-radius: 18px; padding: 14px; border: 1px solid #32364F; display: flex; flex-direction: column; gap: 10px; }
        .panel-title { font-size: 13px; font-weight: 700; color: #FF2A5F; text-transform: uppercase; }

        input, select { width: 100%; padding: 12px; background: #12131C; border: 1px solid #32364F; border-radius: 12px; color: #fff; font-size: 13px; outline: none; }
        
        .btn-action { background: #00B894; color: #fff; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #00896F; }

        /* COMENTARIOS REALES */
        .comments-box { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .comment-card { background: #12131C; padding: 10px; border-radius: 12px; border-left: 4px solid #00B894; font-size: 12px; line-height: 1.3; }
        .comment-card.hate { border-left-color: #FF7675; }
        .user-name { font-weight: 700; color: #FFD166; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="game-app">
    <div class="top-bar">
        <div>👥 <span id="subs" class="stat-val">0</span></div>
        <div>👁️ <span id="views" class="stat-val">0</span></div>
        <div>💰 $<span id="money" class="stat-val">100</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('studio')">🎬 ESTUDIO</button>
        <button class="tab-btn" onclick="showTab('shop')">👗 TIENDA</button>
    </div>

    <div id="tab-studio" class="view-content">
        <div class="room-stage" id="room-bg">
            <img id="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=GirlCreator" class="avatar-real" alt="Avatar">
        </div>

        <div class="panel">
            <div class="panel-title">📹 Grabar Nuevo Video</div>
            <select id="video-type">
                <option value="vlog">Vlog Diario / Mi Rutina</option>
                <option value="fashion">GRWM / Moda y Maquillaje</option>
                <option value="gaming">Gameplay / Jugando Avatar World</option>
            </select>
            <input type="text" id="video-title" placeholder="Título para tu video...">
            <button class="btn-action" onclick="postVideo()">🚀 PUBLICAR</button>
        </div>

        <div class="panel">
            <div class="panel-title">💬 Comentarios de Fans</div>
            <div id="comments-box" class="comments-box">
                <div class="comment-card"><div class="user-name">Comunidad</div>¡Escribe tu primer título para ver las reacciones de tus suscriptores!</div>
            </div>
        </div>
    </div>
</div>

<script>
    let stats = { subs: 0, views: 0, money: 100 };

    const COMMENTS = {
        vlog: [
            "¡Me encantó este vlog! Tu contenido es súper entretenido ✨",
            "¡Amé el video! Por favor sube segunda parte pronto ❤️",
            "Qué buena vibra transmites, ya me suscribí 🚀"
        ],
        fashion: [
            "¡Ese outfit te queda divino! ¿De dónde es? 😍",
            "Amo tus tips de maquillaje, 10/10 este video ✨",
            "¡Qué bonito estilo tienes! Me diste muchas ideas 💕"
        ],
        gaming: [
            "¡Jajaja estuvo buenísima esa partida! 🔥",
            "Sube más videos jugando esto, me dio mucha risa 😂",
            "¡Qué pro eres jugando! Nuevo sub 👍"
        ]
    };

    function showTab(tab) {
        // Lógica de navegación limpia
    }

    function postVideo() {
        const title = document.getElementById('video-title').value.trim();
        const type = document.getElementById('video-type').value;

        if (!title) return;

        let gainViews = Math.floor(Math.random() * 300) + 100;
        let gainSubs = Math.floor(gainViews / 5);
        let gainMoney = Math.floor(gainViews * 0.15);

        stats.views += gainViews;
        stats.subs += gainSubs;
        stats.money += gainMoney;

        const list = COMMENTS[type];
        const randomComment = list[Math.floor(Math.random() * list.length)];

        addComment("Fan_Belleza", randomComment, false);
        updateStats();
        document.getElementById('video-title').value = '';
    }

    function addComment(user, text, isHate) {
        const box = document.getElementById('comments-box');
        const card = document.createElement('div');
        card.className = `comment-card ${isHate ? 'hate' : ''}`;
        card.innerHTML = `<div class="user-name">${user}</div>${text}`;
        box.prepend(card);
    }

    function updateStats() {
        document.getElementById('subs').innerText = stats.subs;
        document.getElementById('views').innerText = stats.views;
        document.getElementById('money').innerText = stats.money;
    }
</script>

</body>
</html>
